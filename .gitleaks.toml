# gitleaks configuration: the default rules, plus known false positives.
# Run before going public and before each release: `gitleaks git .`

[extend]
useDefault = true

[[allowlists]]
description = "The Fernet key the tests use; it decodes to 'test-only-key-for-unit-tests-32b'"
regexes = ['''dGVzdC1vbmx5LWtleS1mb3ItdW5pdC10ZXN0cy0zMmI=''']
