[project]
name = "sweatstack"
version = "0.91.0"
description = "The official Python client for SweatStack"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aart Goossens", email = "aart@sweatstack.no" }
]
requires-python = ">=3.10"
keywords = ["sweatstack", "sports", "fitness", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Frame libraries are extras: the base package serves FastAPI services, webhook
# consumers and anyone who only needs the models. CI's bare-install job keeps it so.
dependencies = [
    "email-validator>=2.2.0",
    "httpx>=0.28.1",
    "open-sport-taxonomy[pydantic]>=0.10.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.10.5",
]

[project.urls]
Homepage = "https://sweatstack.no"
Documentation = "https://docs.sweatstack.no/learn/python/"
Repository = "https://github.com/SweatStack/sweatstack-python"
Issues = "https://github.com/SweatStack/sweatstack-python/issues"
Changelog = "https://github.com/SweatStack/sweatstack-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
arrow = [
    # output="arrow", and what DuckDB needs to query any in-memory frame (its Python
    # API bridges Polars frames and Arrow tables through pyarrow).
    # >=20: 18/19 raise "Repetition level histogram size mismatch" reading the server's
    # polars-written parquet (size-statistics histograms); fixed in pyarrow 20.
    "pyarrow>=20.0.0",
]
pandas = [
    "sweatstack[arrow]",  # pandas reads parquet through pyarrow
    "pandas>=2.2.3",
]
polars = [
    # >=1.30 verified: reads the server's float16 columns (as Float32 before Float16
    # support landed, as Float16 after; the client casts to Float32 either way).
    "polars>=1.30",
]
streamlit = [
    "sweatstack[pandas]",
    "streamlit>=1.42.0",
]
fastapi = [
    "fastapi[standard]>=0.100.0",
    "cryptography>=41.0.0",
]

[project.scripts]
generate-response-models = "sweatstack.cli:generate_response_models"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.54.1",
    "pandas>=2.2.3",
    "polars>=1.30",
    "pyarrow>=20.0.0",
    "pytest>=9.0.3",
    "ruff==0.16.10",
    "streamlit>=1.42.0",
    "ty==0.0.84",
]
evals = [
    "logfire==5.1.1",
    "pydantic-ai-harness[skills]==0.54.0",
    "pydantic-ai-slim[anthropic]==2.54.0",
    "pydantic-evals==2.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/sweatstack/openapi_schemas.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length; long strings and URLs stay intact

[tool.ruff.lint.per-file-ignores]
# These modules build the public surface: their imports are re-exports.
"src/sweatstack/__init__.py" = ["F401"]
"src/sweatstack/schemas.py" = ["F401"]
"src/sweatstack/client.py" = ["F401"]

[tool.ty.src]
include = ["src", "tests/typing"]
exclude = ["src/sweatstack/openapi_schemas.py"]  # generated

[tool.pytest.ini_options]
testpaths = ["tests"]  # evals/ needs the evals group; run it with `python -m evals.agent.run`
