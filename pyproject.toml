[project]
name = "sweatstack"
version = "0.84.0"
description = "The official Python client for SweatStack"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aart Goossens", email = "aart@sweatstack.no" }
]
requires-python = ">=3.10"
keywords = ["sweatstack", "sports", "fitness", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "email-validator>=2.2.0",
    "httpx>=0.28.1",
    "open-sport-taxonomy[pydantic]>=0.10.0",
    "pandas>=2.2.3",
    "platformdirs>=4.0.0",
    # >=20: 18/19 raise "Repetition level histogram size mismatch" reading the server's
    # polars-written parquet (size-statistics histograms); fixed in pyarrow 20.
    "pyarrow>=20.0.0",
    "pydantic>=2.10.5",
]

[project.urls]
Homepage = "https://sweatstack.no"
Documentation = "https://docs.sweatstack.no/getting-started/"
Repository = "https://github.com/SweatStack/sweatstack-python"
Issues = "https://github.com/SweatStack/sweatstack-python/issues"
Changelog = "https://github.com/SweatStack/sweatstack-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.42.0",
]
jupyter = [
    "ipython>=8.31.0",
    "jupyterlab>=4.3.4",
    "matplotlib>=3.10.0",
]
fastapi = [
    "fastapi[standard]>=0.100.0",
    "cryptography>=41.0.0",
]

[project.scripts]
generate-response-models = "sweatstack.cli:generate_response_models"
sweatshell = "sweatstack.sweatshell:run_ipython"
sweatlab = "sweatstack.jupyterlab_oauth2_startup:start_jupyterlab_with_oauth"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.54.1",
    "myst-parser>=4.0.1",
    "pytest>=9.0.3",
    "sphinx>=8.2.3",
    "sphinx-markdown-builder>=0.6.8",
    "streamlit>=1.42.0",
]

[tool.uv.workspace]
members = ["playground"]
